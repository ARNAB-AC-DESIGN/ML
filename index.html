<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PCOS Detection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 60px;
      background-color: #f5f5f5;
      background-image: url('8.jpg'); /* Replace with your image file */
      background-size: cover;       /* Cover the entire page */
      background-position: center;  /* Center the image */
      background-repeat: no-repeat; /* Don't repeat the image */
      font-family: Arial, sans-serif;
      height: 200vh
    }
    .navbar {
      width: 100%;
      background-color: #e99de9;
      color: rgb(3, 0, 0);
      display: flex;        /* It can be deleted when it is in middle */
      justify-content: space-between;
      align-items: center;
      position: fixed;
      padding-left: 3%;
      top: 0;
      left: 0;
      z-index: 1000;
      text-align: center;

  }
  .navbar a {
      float: left;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
  }
  .navbar a:hover {
      background-color: #575757;
  }
  .logout-btn {
    background-color: #e53935;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .logout-btn:hover {
    background-color: #c62828;
  }
    h2 {
      color: #2c3e50;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #34495e;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2980b9;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      font-weight: bold;
    }
    .positive {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .negative {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
    .info-text {
      font-size: 14px;
      color: #7f8c8d;
      margin-top: 5px;
    }
    #extra-content {
      margin-top: 20px;
    }
    #consultBtn {
      background-color: #e74c3c;
      color: white;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    #consultBtn:hover {
      background-color: #c0392b;
    }
    .nav-left {
      display: flex;
      align-items: center;
      padding-right: 6%;
      padding-bottom: 1rem;
      padding-top: 0%;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    CHECK YOUR PCOS FOR YOUR BETTER AND HEALTHY LIFE
    <div class="nav-left">
      <button onclick="window.location.href='http://localhost/Hospital_Website/login.html'" class="logout-btn">Logout</button>
    </div>
  </div>

  <h2>PCOS Detection System</h2>

  <div class="form-group">
    <label for="Age">Age</label>
    <input type="number" id="age" placeholder="Enter age (e.g., 12)" min="0" step="1" />
  </div>

  <div class="form-group">
    <label for="marry">Marital status</label>
    <select id="status">
      <option value="0">Unmarried</option>
      <option value="1">Married</option>
    </select>
  </div>

  <div class="form-group">
    <label for="abortion">No of Abortion</label>
    <select id="status">
      <option value="0">Zero</option>
      <option value="1">One</option>
      <option value="2">More than 2</option>
    </select>
  </div>

  <div class="form-group">
    <label for="FollicleR">Follicle No. (Right)</label>
    <input type="number" id="FollicleR" placeholder="Enter number (e.g., 12)" min="0" step="1" />
    <div class="info-text">Normal range: 5-10 per ovary</div>
  </div>

  <div class="form-group">
    <label for="FollicleL">Follicle No. (Left)</label>
    <input type="number" id="FollicleL" placeholder="Enter number (e.g., 10)" min="0" step="1" />
  </div>

  <div class="form-group">
    <label for="Skindarkening">Skin Darkening</label>
    <select id="Skindarkening">
      <option value="0">No</option>
      <option value="1">Yes</option>
    </select>
  </div>

  <div class="form-group">
    <label for="hairgrowth">Excessive Hair Growth</label>
    <select id="hairgrowth">
      <option value="0">No</option>
      <option value="1">Yes</option>
    </select>
  </div>

  <div class="form-group">
    <label for="Weightgain">Unexplained Weight Gain</label>
    <select id="Weightgain">
      <option value="0">No</option>
      <option value="1">Yes</option>
    </select>
  </div>

  <div class="form-group">
    <label for="Cycle">Menstrual Cycle Pattern</label>
    <input type="number" id="Cycle" placeholder="Enter number (e.g., 10)" min="0" step="1" />
  </div>

  <button onclick="predictPCOS()">Predict PCOS Risk</button>

  <div id="result"></div>
  <div id="extra-content"></div>

  <script>
    async function predictPCOS() {
      const FollicleR = document.getElementById("FollicleR").value;
      const FollicleL = document.getElementById("FollicleL").value;
      const Skindarkening = document.getElementById("Skindarkening").value;
      const hairgrowth = document.getElementById("hairgrowth").value;
      const Weightgain = document.getElementById("Weightgain").value;
      const Cycle = document.getElementById("Cycle").value;

      const resultDiv = document.getElementById("result");
      const extraDiv = document.getElementById("extra-content");
      resultDiv.textContent = "";
      extraDiv.innerHTML = "";

      if (!FollicleR || !FollicleL || FollicleR < 0 || FollicleL < 0) {
        showResult("Please enter valid follicle counts (numbers ≥ 0)", "error");
        return;
      }

      const data = {
        "Follicle No.(R)": parseFloat(FollicleR),
        "Follicle No.(L)": parseFloat(FollicleL),
        "Skin darkening(Y/N)": parseFloat(Skindarkening),
        "hair growth(Y/N)": parseFloat(hairgrowth),
        "Weight gain(Y/N)": parseFloat(Weightgain),
        "Cycle(R/I)": parseFloat(Cycle)
      };

      try {
        const response = await fetch("http://127.0.0.1:5000/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          const probability = parseFloat((result.probability * 100).toFixed(1));

          console.log("Probability:", probability);

          if (probability >= 90) {
            showResult(`PCOS Risk: VERY HIGH (${probability}%). Immediate consultation recommended.`, "positive");

            const btn = document.createElement("button");
            btn.id = "consultBtn";
            btn.textContent = "Consult a Specialist Now";
            btn.onclick = () => window.location.href = "option_list.html";
            extraDiv.appendChild(btn);

          } else if (probability >= 40) {
            showResult(`PCOS Risk: MODERATE (${probability}%).`, "positive");

            const precautions = `
              <ul>
                <li>Maintain a healthy diet and avoid processed sugar</li>
                <li>Engage in regular physical exercise</li>
                <li>Track your menstrual cycles</li>
                <li>Manage stress with yoga or meditation</li>
                <li>Consult your doctor for further tests</li>
              </ul>
            `;
            extraDiv.innerHTML = `<div style="margin-top:10px;"><strong>Precautionary Advice:</strong>${precautions}</div>`;
          } else {
            showResult(`PCOS Risk: LOW (${probability}%). No significant signs detected.`, "negative");
          }
        } else {
          showResult("Error: " + (result.error || "Unknown error occurred"), "error");
        }

      } catch (error) {
        console.error("API Error:", error);
        showResult("Failed to connect to the prediction service. Please try again later.", "error");
      }
    }

    function showResult(message, type) {
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = message;
      resultDiv.className = type;
    }
  </script>
</body>
</html>
